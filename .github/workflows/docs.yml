name: Docs

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v5

      # Nuxt Content uses Node's built-in SQLite.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # Vite's TS transform cannot match `[...slug].vue` against docs/tsconfig's globs, so it
      # falls back to the app's root tsconfig, which extends ./.nuxt/tsconfig.json. The app is
      # not installed here, so give that file an empty stand-in.
      - run: mkdir -p .nuxt && echo '{}' > .nuxt/tsconfig.json
        working-directory: .

      - run: bun run generate

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
